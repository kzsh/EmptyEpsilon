<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>EmptyEpsilon</title>
    <link rel="icon" href="data:,">
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        color: #ccc;
        font-family: system-ui, sans-serif;
      }
      #canvas {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        outline: none;
        background: #000;
      }
      #status {
        position: absolute;
        top: 50%;
        left: 0;
        width: 100%;
        transform: translateY(-50%);
        text-align: center;
        font-size: 1.1em;
        letter-spacing: 0.1em;
      }
      #status.hidden { display: none; }
      #progress {
        display: block;
        width: 20em;
        margin: 1em auto 0;
        height: 0.4em;
        accent-color: #8ab4d8;
      }
      /* Log overlay, only shown with #log in the URL. */
      #output {
        position: absolute;
        left: 0;
        bottom: 0;
        width: 100%;
        height: 30%;
        margin: 0;
        display: none;
        box-sizing: border-box;
        background: rgba(0, 0, 0, 0.75);
        color: #9c9;
        border: 0;
        border-top: 1px solid #333;
        font-family: monospace;
        font-size: 12px;
        resize: none;
      }
      body.show-log #output { display: block; }
    </style>
  </head>
  <body>
    <canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
    <div id="status">loading<progress id="progress" value="0" max="100"></progress></div>
    <textarea id="output" readonly></textarea>

    <script type="text/javascript">
      var statusElement = document.getElementById('status');
      var progressElement = document.getElementById('progress');
      var outputElement = document.getElementById('output');
      var canvasElement = document.getElementById('canvas');

      if (location.hash.indexOf('log') !== -1)
        document.body.classList.add('show-log');

      // The canvas backing store is owned by SDL: it sizes it on window
      // creation and on the browser resize event. Setting width/height here as
      // well only desynchronises it from the GL viewport.

      var Module = {
        canvas: canvasElement,
        // Log lines are kept around so they can be inspected from the console
        // (or a test harness) even when the overlay is hidden.
        logLines: [],
        print: function(text) {
          Module.logLines.push(text);
          if (Module.logLines.length > 2000) Module.logLines.shift();
          console.log(text);
          if (outputElement) {
            outputElement.value = Module.logLines.join('\n');
            outputElement.scrollTop = outputElement.scrollHeight;
          }
        },
        printErr: function(text) {
          Module.print(text);
        },
        setStatus: function(text) {
          if (!statusElement) return;
          if (!text) {
            statusElement.classList.add('hidden');
            return;
          }
          statusElement.classList.remove('hidden');
          var match = /([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/.exec(text);
          if (match) {
            statusElement.firstChild.nodeValue = match[1];
            progressElement.value = parseInt(match[2]) * 100 / parseInt(match[4]);
            progressElement.hidden = false;
          } else {
            statusElement.firstChild.nodeValue = text;
            progressElement.hidden = true;
          }
        },
        totalDependencies: 0,
        monitorRunDependencies: function(left) {
          this.totalDependencies = Math.max(this.totalDependencies, left);
          Module.setStatus(left ?
            'loading (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')' :
            '');
        }
      };
      Module.setStatus('loading');

      window.onerror = function(message) {
        Module.setStatus('error: ' + message + ' - see the browser console');
      };

      // Keyboard input should go to the game, not scroll the page.
      canvasElement.addEventListener('mousedown', function() { canvasElement.focus(); });
      window.addEventListener('keydown', function(event) {
        if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Tab'].indexOf(event.code) !== -1)
          event.preventDefault();
      });
    </script>
    {{{ SCRIPT }}}
  </body>
</html>
